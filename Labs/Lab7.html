
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
            text-align: center;
        }

        header {
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            width: 280px;
            margin: 5px;
        }

        button {
            padding: 12px;
            margin: 5px;
            cursor: pointer;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #555;
        }

        #imageResults {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .image-card {
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
        }

        .image-card p {
            font-size: 14px;
        }

        #sampleOutput {
            display: block;
            margin-top: 20px;
            text-align: left;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <header>
        <h1>Unsplash Image Search</h1>

        <input
            id="inputBox"
            type="text"
            placeholder="Enter an image keyword"
            value="Nature"
        >

        <button id="xhrButton">Search using XHR</button>

        <button id="fetchButton">Search using Fetch</button>

        <button id="asyncButton">
            Search using Fetch with Async/Await
        </button>
    </header>

    <h2 id="title">Search Results</h2>

    <p id="status"></p>

    <div id="imageResults"></div>



    <script>

        const ACCESS_KEY = "69doF6TxvmnH7G6ItiwGdqYt0azaLCThmcNh4pM28XY";

        function displayImages(data) {

            var resultsElem = document.getElementById("imageResults");
            var titleElem = document.getElementById("title");

            resultsElem.innerHTML = "";

            titleElem.innerText = "Search Results: " + data.total;

            if (data.results.length === 0) {
                resultsElem.innerText = "No images found.";
                return;
            }

            data.results.forEach(photo => {

                var card = document.createElement("div");
                card.className = "image-card";

                var img = document.createElement("img");
                img.src = photo.urls.small;
                img.alt = photo.alt_description || "Unsplash image";

                var description = document.createElement("p");
                description.innerText =
                    photo.alt_description || "Unsplash Photo";

                var photographer = document.createElement("p");
                photographer.innerText =
                    "Photographer: " + photo.user.name;

                img.addEventListener("click", function () {
                    window.open(photo.links.html, "_blank");
                });

                card.appendChild(img);
                card.appendChild(description);
                card.appendChild(photographer);

                resultsElem.appendChild(card);
            });
        }


        function showError(message) {

            document.getElementById("status").innerText = message;

        }



        function searchUsingXHR() {

            var userId = document.getElementById("inputBox").value.trim();

            var statusElem = document.getElementById("status");

            if (!userId) {
                showError("Please enter a search keyword.");
                return;
            }

            statusElem.innerText = "Loading...";

            var xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function () {

       
                if (this.readyState == 4) {

                    if (this.status == 200) {

                        var responseObj = JSON.parse(xhr.responseText);

                        displayImages(responseObj);

                        statusElem.innerText = "Search completed!";

                    } else {

                        showError("Error: " + this.status);

                    }
                }
            };


            xhr.open(
                "GET",
                "https://api.unsplash.com/search/photos?query="
                + encodeURIComponent(userId),
                true
            );

            xhr.setRequestHeader(
                "Authorization",
                "Client-ID " + ACCESS_KEY
            );

            xhr.send();
        }



        function searchUsingFetch() {

            var userId = document.getElementById("inputBox").value.trim();

            if (!userId) {
                showError("Please enter a search keyword.");
                return;
            }

            document.getElementById("status").innerText = "Loading...";

            fetch(
                "https://api.unsplash.com/search/photos?query="
                + encodeURIComponent(userId),
                {
                    headers: {
                        "Authorization": "Client-ID " + ACCESS_KEY
                    }
                }
            )

            .then(response => {

                if (!response.ok) {
                    throw new Error("HTTP Error: " + response.status);
                }

                return response.json();

            })

            .then(data => {

                displayImages(data);

                document.getElementById("status").innerText =
                    "Search completed!";

            })

            .catch(error => {

                showError(error.message);

            });
        }


        async function searchUsingFetchAwaitAsync() {

            var userId = document.getElementById("inputBox").value.trim();

            if (!userId) {
                showError("Please enter a search keyword.");
                return;
            }

            document.getElementById("status").innerText = "Loading...";

            try {

                let response = await fetch(
                    "https://api.unsplash.com/search/photos?query="
                    + encodeURIComponent(userId),
                    {
                        headers: {
                            "Authorization": "Client-ID " + ACCESS_KEY
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error("HTTP Error: " + response.status);
                }

                let data = await response.json();

                displayImages(data);

                document.getElementById("status").innerText =
                    "Search completed!";

            }

            catch (error) {

                showError(error.message);

            }
        }


        document.getElementById("xhrButton")
            .addEventListener("click", searchUsingXHR);
        document.getElementById("fetchButton")
            .addEventListener("click", searchUsingFetch);
        document.getElementById("asyncButton")
            .addEventListener("click", searchUsingFetchAwaitAsync);



        document.getElementById("inputBox")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    searchUsingFetch();
                }

            });

    </script>

</body>
</html>
